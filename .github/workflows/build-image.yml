name: Build ConsolePi OS image

# Builds Raspberry Pi OS Lite (arm64) images with ConsolePi pre-installed.
#  - manually: Actions tab -> "Build ConsolePi OS image" -> Run workflow  (images are attached to the run as artifacts)
#  - on tag image-v*: builds the image and publishes a GitHub release with it
# Base: Raspberry Pi OS 13 (trixie).  To add another base, extend matrix.base below.
on:
  workflow_dispatch:
    inputs:
      wlan_country:
        description: "WiFi country code"
        default: DE
      timezone:
        description: "Timezone"
        default: Europe/Berlin
  push:
    tags: ["image-v*"]

permissions:
  contents: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        base: [trixie]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq parted zerofree xz-utils e2fsprogs curl

      - name: Build image
        env:
          BASE: ${{ matrix.base }}
          WLAN_COUNTRY: ${{ inputs.wlan_country || 'DE' }}
          TIMEZONE: ${{ inputs.timezone || 'Europe/Berlin' }}
          CONSOLEPI_REPO: ${{ github.repository }}
          CONSOLEPI_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch }}
        run: |
          case "$BASE" in
            trixie)   export BASE_IMAGE_URL=https://downloads.raspberrypi.com/raspios_lite_arm64_latest ;;
            *) echo "unknown base $BASE"; exit 1 ;;
          esac
          # file name version: tag image-v0.1.3 -> v0.1.3, manual runs -> dev-<date>-<commit>
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export IMG_VERSION="${GITHUB_REF_NAME#image-}"
          else
            export IMG_VERSION="dev-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          sudo --preserve-env=BASE_IMAGE_URL,WLAN_COUNTRY,TIMEZONE,CONSOLEPI_REPO,CONSOLEPI_BRANCH,IMG_VERSION \
            OUT_DIR="$RUNNER_TEMP/out" WORK_DIR="$RUNNER_TEMP/work" bash image/build-image.sh
          # the image must really be the requested release (raspios "latest" links move over time)
          grep -q -- "-${BASE}-" "$RUNNER_TEMP/out/build-info.txt" || { cat "$RUNNER_TEMP/out/build-info.txt"; exit 1; }
          sudo mv "$RUNNER_TEMP/out/build-info.txt" "$RUNNER_TEMP/out/build-info-${BASE}.txt"

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.base }}
          path: |
            ${{ runner.temp }}/out/install.log
            ${{ runner.temp }}/out/build-info-*.txt
          if-no-files-found: ignore

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: consolepi-image-${{ matrix.base }}
          path: |
            ${{ runner.temp }}/out/*.img.xz
            ${{ runner.temp }}/out/*.sha256
            ${{ runner.temp }}/out/build-info-*.txt
          compression-level: 0   # already xz compressed
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/image-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags for the list of changes

      - uses: actions/download-artifact@v4
        with:
          pattern: consolepi-image-*
          merge-multiple: true
          path: out

      - name: List changes since the previous release
        run: |
          # previous image-v* tag in version order (image-v0.1.10 comes after image-v0.1.9)
          prev=$(git tag -l 'image-v*' --sort=-v:refname | grep -A1 -Fx "$GITHUB_REF_NAME" | sed -n 2p)
          {
            if [ -n "$prev" ]; then
              echo "**Changes since $prev**"
              echo
              git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" -- . ':!.github/dependabot.yml' | grep -v '^- Bump ' || echo "- (no code changes)"
              echo
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              echo "**First image release**"
            fi
          } > "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          ls -l
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "ConsolePi Image $GITHUB_REF_NAME" \
            --notes-file <(cat <<EOF
          Raspberry Pi OS Lite (64 bit) with ConsolePi pre-installed – Pi Zero 2 W, 3B/3B+, 4, 400, 5.

          Base: Raspberry Pi OS 13 (trixie).

          $(cat "$RUNNER_TEMP/changes.md")

          **Quick start**
          1. Write the \`.img.xz\` with Raspberry Pi Imager (*Use custom*) or balenaEtcher.
          2. Re-plug the card, edit \`consolepi-setup.txt\` on the **bootfs** drive (user, password, WiFi), save.
          3. Boot, then open \`https://consolepi.local\` in a browser or \`ssh <user>@consolepi.local\`.
             No WiFi in range: join the hotspot \`ConsolePi\` and open \`https://10.110.0.1\`.

          Full guide: [image/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/image/README.md)

          \`\`\`
          $(cat build-info-*.txt)
          \`\`\`
          EOF
            ) \
            ./*.img.xz ./*.sha256
